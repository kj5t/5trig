[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "5trig"
version = "0.1.0"
description = "Cross-platform Yaesu transceiver control application"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Steve", email = "steve@5tmuzak.com" }]
requires-python = ">=3.11"

dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "qasync>=0.27",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "platformdirs>=4.0",
    "tomli-w>=1.0",
    "tomllib>=2.0; python_version < '3.11'",
    "httpx>=0.26",
    "adif-io>=0.0.3",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "opuslib>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.3",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
5trig = "fivetr.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fivetr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
